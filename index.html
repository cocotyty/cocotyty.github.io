<style>
:root{
  --bg:#0a0a10; --panel:#15151f; --panel2:#1c1c29; --line:#2e2e40; --line2:#45455e;
  --text:#cfc9b8; --dim:#8a8578; --gold:#f2cf46; --blood:#ff3b30; --green:#7cd63e;
  --font:'Press Start 2P','Zpix','SimSun',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:12px;line-height:1.7}
body{min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%,#141228 0%,transparent 55%),
    radial-gradient(ellipse at 50% 115%,#1c1016 0%,transparent 50%),
    var(--bg)}
a{color:var(--gold);text-decoration:none}
a:hover{text-shadow:0 0 8px #f2cf4688}
.wrap{max-width:980px;margin:0 auto;padding:34px 18px 60px}

/* ---------- 顶部 Profile ---------- */
.hero{display:flex;gap:22px;align-items:center;padding:22px;
  background:linear-gradient(135deg,#181826 0%,#12121c 100%);
  border:2px solid var(--line2);box-shadow:0 6px 0 #000,inset 0 0 0 2px #0d0d14;
  margin-bottom:14px;flex-wrap:wrap;position:relative}
.avatar-box{flex:0 0 auto;position:relative}
.avatar{width:92px;height:92px;image-rendering:pixelated;border:3px solid var(--line2);

.avatar-box .dot{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;
  background:#22301c;border:2px solid var(--green);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.hero-info{flex:1 1 300px;min-width:260px}
.hero-name{font-size:18px;color:#ffedd0;letter-spacing:2px;margin:0 0 2px;
  text-shadow:0 0 12px #ff8c2855,2px 2px 0 #000}
.hero-name .hand{color:var(--blood);text-shadow:0 0 10px #c2232388}
.hero-sub{font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
.hero-bio{font-size:10px;color:var(--text);margin:0 0 10px;font-family:var(--font)}
.hero-bio b{color:var(--gold);font-weight:normal}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:8px;padding:5px 9px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);box-shadow:0 2px 0 #000}
.chip b{color:var(--text);font-weight:normal}
.chip.star b{color:var(--gold)}
.lang-btn{position:absolute;top:10px;right:10px;font-family:var(--font);font-size:9px;
  color:var(--text);background:var(--panel2);border:2px solid var(--line2);cursor:pointer;
  padding:7px 11px;letter-spacing:1px;box-shadow:0 3px 0 #000}
.lang-btn:hover{border-color:var(--gold);color:var(--gold)}
.lang-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}

/* ---------- 标题 ---------- */
.sec-title{margin:34px 0 16px;font-size:13px;color:#ffedd0;letter-spacing:4px;
  text-shadow:0 0 10px #ff8c2844,2px 2px 0 #000;display:flex;align-items:center;gap:12px}
.sec-title::after{content:"";flex:1;height:2px;
  background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 12px)}

/* ---------- 游戏卡片 ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{position:relative;display:block;background:var(--panel);
  border:2px solid var(--line);box-shadow:0 6px 0 #000;
  transition:transform .1s,border-color .1s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card:hover .card-go{opacity:1;transform:translateX(0)}
.card-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#050508;overflow:hidden}
.card-thumb canvas{position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges}
.card-thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}
.badge-new{position:absolute;top:8px;left:8px;z-index:2;font-size:8px;color:#fff;

.tags{display:flex;gap:6px;flex-wrap:wrap}

const Lang = {
  cur: 'zh',
  detect(){
    try{
      const saved = localStorage.getItem('gallery-lang');
      if(saved === 'zh' || saved === 'en') return saved;
      const nav = (navigator.language || (navigator.languages||[''])[0] || '').toLowerCase();
      return nav.startsWith('zh') ? 'zh' : 'en';
    }catch(e){ return 'zh'; }
  },
  apply(lang){
    this.cur = lang;
    const d = I18N[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if(d[k] !== undefined) el.innerHTML = d[k];
    });
    document.querySelectorAll('[data-i18n-tags]').forEach(el=>{
      const k = el.getAttribute('data-i18n-tags');
      el.innerHTML = (d[k]||[]).map(t=>'<span class="tag">'+t+'</span>').join('');
    });
    document.getElementById('lang-btn').textContent = d.btnLabel;
    try{ localStorage.setItem('gallery-lang', lang); }catch(e){}
  },
  toggle(){ this.apply(this.cur === 'zh' ? 'en' : 'zh'); }
};
Lang.apply(Lang.detect());
document.getElementById('lang-btn').addEventListener('click', ()=>Lang.toggle());

/* ============================================================
 * Gallery 缩略图动画(复用各游戏自己的像素素材,内联精简版)
 * ============================================================ */

function mk(rows, pal, scale){
  const h = rows.length, w = Math.max(...rows.map(r=>r.length));
  const cv = document.createElement('canvas');
  cv.width = w*(scale||1); cv.height = h*(scale||1);
  const c = cv.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<rows[y].length;x++){
    const ch = rows[y][x];
    if(ch==='.'||ch===' ') continue;
    c.fillStyle = pal[ch] || '#f0f';
    c.fillRect(x*(scale||1), y*(scale||1), scale||1, scale||1);
  }
  return cv;
}
function bgFill(c, w, h, top, bottom){
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0,0,w,h);
}

/* ============ 卡0:三国烽火 ============ */
(function(){
  const cv = document.querySelector('#card-sg canvas');
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const W = 128, H = 72, GY = 46;
  /* 势力旗色 */
  const FLAGS = ['#3f7fd9','#9b59c9','#e04a3f','#3fae5a','#d9a83f'];
  let t = 0, marchers = [];
  for (let i = 0; i < 7; i++) marchers.push({ x: -12 - i * 17, ph: i * 1.2, fc: FLAGS[i % 5] });
  function draw(now) {
    t++;
    /* 夜空 */
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#141024'); g.addColorStop(1, '#241a12');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    /* 星 */
    c.fillStyle = '#cfd8ff';
    for (let i = 0; i < 14; i++) {
      if ((now / 500 + i) % 5 < 3.5) c.fillRect((i * 31 + 7) % W, (i * 13 + 3) % 22, 1, 1);
    }
    /* 月 */
    c.fillStyle = '#f4e8c0'; c.fillRect(104, 8, 9, 9);
    c.fillStyle = '#141024'; c.fillRect(101, 6, 6, 6);
    /* 远山 */
    c.fillStyle = '#1c1a28';
    for (let x = 0; x < W; x += 28) {
      const h = 14 + Math.sin(x * 0.3) * 5;
      c.beginPath(); c.moveTo(x, GY); c.lineTo(x + 14, GY - h); c.lineTo(x + 28, GY); c.closePath(); c.fill();
    }
    /* 长城 + 烽火台 */
    c.fillStyle = '#2a2634'; c.fillRect(0, GY, W, 5);
    for (let x = 0; x < W; x += 9) c.fillRect(x, GY - 3, 5, 3);
    c.fillStyle = '#332e40'; c.fillRect(88, GY - 14, 14, 14);
    c.fillStyle = '#221e2c';
    c.fillRect(86, GY - 17, 4, 4); c.fillRect(93, GY - 17, 4, 4); c.fillRect(100, GY - 17, 4, 4);
    /* 烽火 */

    c.lineTo(cx+34,bot); c.lineTo(cx-34,bot); c.closePath(); c.fill();

    scroll += 0.014;

    c.fillStyle = '#f2cf46';
    const r = 2 + Math.sin(t/500)*0.8;
    c.fillRect(cx-1, cy-r*2, 2, r*4); c.fillRect(cx-r*2, cy-1, r*4, 2);
    const by = 40 + Math.sin(t/800)*2;
    c.drawImage(book, 44, Math.round(by));
    c.drawImage(dice, 80, Math.round(by+3+Math.sin(t/600)*2));
    const g = c.createRadialGradient(cx, cy, 2, cx, cy, 40);
    g.addColorStop(0, 'rgba(142,91,176,0.25)');
    g.addColorStop(1, 'rgba(142,91,176,0)');
    c.fillStyle = g; c.fillRect(0,0,W,H);
    const mt = (t % 3000) / 3000;
    if(mt < 0.25){
      const mx = 20 + mt*400, my = 8 + mt*70;
      c.fillStyle = '#fff';
      c.fillRect(Math.round(mx), Math.round(my), 2, 1);
      c.fillStyle = '#8fa8d0';
      c.fillRect(Math.round(mx)-3, Math.round(my)-1, 3, 1);
    }
  }
  window.__chDraw = draw;
})();

/* ============ 卡-AQ:征服纪元(类英雄无敌地图行军) ============ */
(function(){
  const cv = document.querySelector('#card-aq canvas');
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const W = 128, H = 72;
  /* 迷你地图像素画:地形块 */
  const T = 8;
  const terr = [];
  let sd = 987654321;
  const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
  for (let y = 0; y < H / T; y++) {
    terr[y] = [];
    for (let x = 0; x < W / T; x++) {
      const r = rnd();
      if (y < 2 && r < 0.5) terr[y][x] = 2;           /* 山 */
      else if (y > 7 && r < 0.35) terr[y][x] = 3;     /* 水 */
      else terr[y][x] = r < 0.18 ? 1 : 0;             /* 草/林 */
    }
  }
  const COLS = ['#4e7a3a', '#3c6630', '#5a555e', '#2d5a8e'];
  const ROAD = [[8, 4], [9, 4], [10, 4], [11, 4], [12, 5], [12, 6], [11, 7], [10, 7], [9, 7], [8, 7], [7, 6], [7, 5]];
  function draw(t) {
    for (let y = 0; y < H / T; y++) for (let x = 0; x < W / T; x++) {
      c.fillStyle = COLS[terr[y][x]];
      c.fillRect(x * T, y * T, T, T);
      if (terr[y][x] === 1) { c.fillStyle = '#2c5226'; c.fillRect(x * T + 3, y * T + 2, 2, 4); }
    }
    /* 道路 */
    c.fillStyle = '#8f6f4a';
    for (const [rx, ry] of ROAD) c.fillRect(rx * T, ry * T + 2, T, T - 4);
    /* 迷雾(右上角未探索) */
    c.fillStyle = 'rgba(6,8,16,0.85)';
    c.beginPath(); c.moveTo(W, 0); c.lineTo(W, 30); c.lineTo(92, 12); c.lineTo(88, 0); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(W, 34); c.lineTo(W, H); c.lineTo(104, H); c.lineTo(96, 30); c.closePath(); c.fill();
    /* 城堡与守卫塔 */
    c.font = '13px serif'; c.textAlign = 'center';
    c.fillText('🏰', 18, 34);
    c.fillText('🗼', 96, 32);
    /* 资源堆/宝箱 */
    c.font = '8px serif';
    c.fillText('🪙', 46, 22);
    c.fillText('🧰', 70, 60);
    c.fillText('⛏️', 40, 62);
    /* 行军英雄沿路走 */
    const ph = (t / 2600) % 1;
    const idx = ph * (ROAD.length - 1);
    const i0 = Math.floor(idx), fr = idx - i0;
    const a = ROAD[Math.min(i0, ROAD.length - 1)], b = ROAD[Math.min(i0 + 1, ROAD.length - 1)];
    const hx = (a[0] + (b[0] - a[0]) * fr) * T + T / 2;
    const hy = (a[1] + (b[1] - a[1]) * fr) * T + T / 2 + Math.sin(t / 130) * 0.8;
    c.font = '12px serif';
    c.fillText('🤺', hx, hy + 4);
    /* 旗帜(路径终点) */
    c.font = '9px serif';
    c.fillText('🚩', 26, 18);
    /* 对战闪光:英雄接近塔楼时 */
    if (ph > 0.72 && ph < 0.86 && (t % 400) < 200) {
      c.font = '12px serif';
      c.fillText('⚔️', 76, 40);
    }
    /* 金币拾取闪光 */
    if (ph > 0.3 && ph < 0.42) {
      c.fillStyle = '#ffd75e';
      c.fillRect(44 + Math.sin(t / 90) * 2, 26, 2, 2);
    }
  }
  window.__aqDraw = draw;
})();

/* ============ 统一动画循环 ============ */
(function loop(){
  const t = performance.now();
  window.__aqDraw && window.__aqDraw(t);
  window.__sgDraw && window.__sgDraw(t);
  window.__gdDraw && window.__gdDraw(t);
  window.__rcDraw && window.__rcDraw(t);
  window.__tdDraw && window.__tdDraw(t);
  window.__vgDraw && window.__vgDraw(t);
  window.__chDraw && window.__chDraw(t);
  requestAnimationFrame(loop);
})();
</script>
