<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>STEEL VANGUARD 钢铁先锋</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;padding:0;height:100%;background:#04050a;overflow:hidden;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at center,#0b0e18 0%,#04050a 70%)}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
         box-shadow:0 0 60px rgba(0,0,0,.9)}

  /* ===== 触屏虚拟手柄 ===== */
  #touchui{position:fixed;inset:0;display:none;pointer-events:none;z-index:10;
    font-family:monospace}
  #touchui *{touch-action:none;box-sizing:border-box}
  body.touch #touchui{display:block}

  /* 左侧方向键 */
  #dpad{position:absolute;left:calc(14px + env(safe-area-inset-left));
        bottom:calc(16px + env(safe-area-inset-bottom));
        width:150px;height:150px;pointer-events:auto;
        border-radius:50%;background:rgba(16,20,28,.48);
        border:2px solid rgba(140,150,170,.40)}
  .dz{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
      color:rgba(220,228,240,.9);font-size:19px;border-radius:12px;
      background:rgba(60,70,90,.45);transition:background .06s,transform .06s}
  .dz.on{background:rgba(255,170,46,.65);color:#fff;transform:scale(1.08)}
  .dz-l{left:5px;top:49px}
  .dz-r{right:5px;top:49px}
  .dz-u{left:49px;top:5px}
  .dz-d{left:49px;bottom:5px}

  /* 右侧动作键 */
  #btns{position:absolute;right:calc(14px + env(safe-area-inset-right));
        bottom:calc(16px + env(safe-area-inset-bottom));
        width:190px;height:170px;pointer-events:none}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        color:rgba(255,255,255,.95);font-weight:bold;letter-spacing:1px;
        border:2px solid rgba(140,150,170,.45);transition:transform .06s}
  .tbtn.on{transform:scale(.92)}
  #bt-fire{right:0;bottom:8px;width:88px;height:88px;font-size:15px;
    background:rgba(200,56,58,.52);border-color:rgba(255,120,110,.6)}
  #bt-fire.on{background:rgba(255,90,60,.8)}
  #bt-jump{right:98px;bottom:0;width:72px;height:72px;font-size:13px;
    background:rgba(70,120,200,.48);border-color:rgba(120,170,255,.55)}
  #bt-jump.on{background:rgba(90,150,255,.75)}
  #bt-nade{right:14px;bottom:104px;width:56px;height:56px;font-size:11px;
    background:rgba(90,150,70,.46);border-color:rgba(150,220,120,.55)}
  #bt-nade.on{background:rgba(120,200,90,.72)}

  /* 右上角系统键 */
  #sysbtns{position:absolute;top:calc(8px + env(safe-area-inset-top));
           right:calc(10px + env(safe-area-inset-right));
           display:flex;gap:8px;pointer-events:auto}
  .sbtn{width:38px;height:38px;border-radius:50%;pointer-events:auto;
        display:flex;align-items:center;justify-content:center;
        background:rgba(16,20,28,.5);border:1px solid rgba(140,150,170,.35);
        color:rgba(220,228,240,.85);font-size:13px;font-weight:bold;font-family:monospace}
  .sbtn:active{background:rgba(255,170,46,.5)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>

  <div id="touchui">
    <div id="dpad">
      <div class="dz dz-l" data-a="left">&#9664;</div>
      <div class="dz dz-r" data-a="right">&#9654;</div>
      <div class="dz dz-u" data-a="up">&#9650;</div>
      <div class="dz dz-d" data-a="down">&#9660;</div>
    </div>
    <div id="btns">
      <div class="tbtn" id="bt-nade">NADE</div>
      <div class="tbtn" id="bt-jump">JUMP</div>
      <div class="tbtn" id="bt-fire">FIRE</div>
    </div>
    <div id="sysbtns">
      <div class="sbtn" id="sb-pause">II</div>
      <div class="sbtn" id="sb-mute">M</div>
      <div class="sbtn" id="sb-fs">FS</div>
    </div>
  </div>
</div>

<script src="js/audio.js?v=3"></script>
<script src="js/sprites.js?v=3"></script>
<script src="js/levels.js?v=3"></script>
<script src="js/entities.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
